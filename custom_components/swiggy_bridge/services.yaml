add_to_cart:
  name: Add to Instamart cart
  description: Adds an item to the Instamart cart via the Swiggy MCP Bridge add-on.
  fields:
    item_id:
      name: Item ID
      description: The product/item identifier as returned by Instamart's search/catalog tool.
      required: true
      selector:
        text:
    quantity:
      name: Quantity
      required: false
      default: 1
      selector:
        number:
          min: 1
          max: 50
