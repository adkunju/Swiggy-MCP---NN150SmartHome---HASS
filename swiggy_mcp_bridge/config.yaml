name: Swiggy MCP Bridge
version: "0.1.1"
slug: swiggy_mcp_bridge
description: >-
  Local OAuth-authenticated bridge between Home Assistant and Swiggy's
  Builders Club MCP servers (Instamart, Dineout). Owns the OAuth session;
  the HACS integration only reads from this add-on's local API.
url: https://github.com/adkunju/Swiggy-MCP---NN150SmartHome---HASS
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:cart-outline
panel_title: Swiggy MCP Bridge
webui: "[PROTO:ingress]://[HOST]:[PORT:8099]/"
ports:
  8099/tcp: null
options:
  log_level: info
  # Which MCP servers to enable. Instamart is the current priority; add
  # "dineout" back when you want it. "food" is listed for completeness but
  # is not currently grantable to third-party integrators -- see README.
  enabled_servers:
    - instamart
schema:
  log_level: list(debug|info|warning|error)
  enabled_servers:
    - list(instamart|dineout|food)
map:
  - addon_config:rw
  - ssl
